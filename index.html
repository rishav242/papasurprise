
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Secret Surprise for Papa</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-family: Georgia, serif;
  color: white;
  background:
    radial-gradient(circle at 50% 50%, #483057, transparent 60%),
    linear-gradient(135deg, #090715, #1a102c, #080613);
}

/* Floating golden stars */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #ffdb85;
  box-shadow: 0 0 12px #ffcb55;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.1; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1.7); }
}

/* Golden glow behind the gift */
.glow {
  position: absolute;
  width: min(70vw, 500px);
  height: min(70vw, 500px);
  border-radius: 50%;
  background: radial-gradient(circle, #d9a64a35, transparent 70%);
  animation: breathe 4s infinite alternate;
  pointer-events: none;
}

@keyframes breathe {
  from { transform: scale(0.8); opacity: 0.5; }
  to { transform: scale(1.2); opacity: 1; }
}

/* Center everything */
.container {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: clamp(10px, 2.5vh, 24px);
  padding: 15px;
}

.subtitle {
  color: #d8b978;
  letter-spacing: 4px;
  font-size: clamp(10px, 1.5vw, 14px);
}

h1 {
  font-size: clamp(28px, 5vw, 65px);
  line-height: 1.2;
  background: linear-gradient(90deg, #c58c2d, #fff0b8, #d59d3c);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 35px #ffcc6625;
}

/* Animated gift */
.gift {
  font-size: clamp(75px, 17vh, 155px);
  filter: drop-shadow(0 0 30px #ffce6b);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-18px) rotate(5deg); }
}

.message {
  font-size: clamp(14px, 2vw, 20px);
  color: #e8d7b8;
}

/* Golden surprise button */
.surprise-btn {
  display: inline-block;
  padding: 18px 30px;
  border-radius: 50px;
  background: linear-gradient(135deg, #b67c22, #ffe3a0, #c58a2d);
  color: #261706;
  font: bold clamp(13px, 2vw, 17px) Arial, sans-serif;
  text-decoration: none;
  box-shadow: 0 0 25px #ffd16c88;
  animation: pulse 2s infinite;
  transition: transform 0.3s;
  max-width: 95%;
}

.surprise-btn:hover {
  transform: scale(1.07);
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 15px #ffd16c55; }
  50% { box-shadow: 0 0 45px #ffd16cbb; }
}
#birthdayPage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  z-index: 100;
  background: radial-gradient(
    circle at center,
    #1b2045 0%,
    #090b1c 65%,
    #02030a 100%
  );
  overflow: hidden;
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<main class="container">
  <div class="glow"></div>

  <div class="subtitle">✨ A LITTLE SECRET JUST FOR YOU ✨</div>

  <h1>Papa, I Have Something<br>Special for You! ❤️</h1>

  <div class="gift">🎁</div>

  <p class="message">
    Something beautiful is waiting behind this button...
  </p>

  
<a href="birthday.html" class="surprise-btn" id="surpriseButton">
  Click on this button to get a surprise 🎁
</a>

<script>
document.getElementById("surpriseButton")
  .addEventListener("click", function(event) {
    event.preventDefault();

sessionStorage.setItem("birthdaySurpriseClicked", "yes");

    const button = this;
    button.textContent = "✨ Your surprise is opening... ✨";
    button.style.pointerEvents = "none";

    const gift = document.querySelector(".gift");
    gift.style.animation = "shake 0.3s infinite";

    setTimeout(function() {
      window.location.href = "birthday.html";
    }, 3000);
  });
</script>

<style>
@keyframes shake {
  0% { transform: rotate(-10deg) scale(1.1); }
  50% { transform: rotate(10deg) scale(1.2); }
  100% { transform: rotate(-10deg) scale(1.1); }
}
</style>


</main>

<section id="birthdayPage" style="display: none;">
 <canvas id="fireworks"></canvas>

<main class="birthday-content">
  <p class="subtitle">
    ✨ TODAY IS ALL ABOUT YOU ✨
  </p>

  <h1>
    HAPPY BIRTHDAY<br>
    PAPA 💗
  </h1>

  <a href="letter.html" class="letter-btn">
    💌 Open My Special Letter
  </a>
</main>   
</section>

<script>
const stars = document.getElementById("stars");

for (let i = 0; i < 120; i++) {
  const star = document.createElement("span");
  star.className = "star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDelay = Math.random() * 3 + "s";
  star.style.animationDuration = (1 + Math.random() * 3) + "s";
  stars.appendChild(star);
}
</script>

</body>
</html>
